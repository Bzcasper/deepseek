- insert:
  - id: bot-screen
    name: dsh-bot-screen
    config:
      bin: /home/bobby/agent-tools/bot-screen/bin/bot-screen
      name: default
      # Comma-separated regexes matched against tool names, case-insensitively.
      # The plugin's own screen_* tools are always exempt from the fence, so the
      # agent can read the lease and hand control back.
      fence: screenshot,^computer,playwright,(^|_)cua($|_),(^|_)browser,glass
